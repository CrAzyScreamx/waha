name: Build Custom Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ${{ matrix.runner }}
    name:
      ${{ matrix.engine }} - ${{ matrix.browser }} - ${{ matrix.platform }} -
      ${{ matrix.tag }}
    strategy:
      matrix:
        include:
          # Chromium - x86
          - runner: 'ubuntu-latest'
            tag: 'latest'
            platform: 'amd64'
            browser: 'chromium'
            engine: 'WEBJS'
            goss: 'goss-linux-amd64'

          # Chromium - ARM
          - runner: 'ubuntu-24.04-arm'
            tag: 'arm'
            platform: 'linux/arm64'
            browser: 'chromium'
            engine: 'WEBJS'
            goss: 'goss-linux-arm'

          # Chrome - x86
          - runner: 'ubuntu-latest'
            tag: 'chrome'
            platform: 'amd64'
            browser: 'chrome'
            engine: 'WEBJS'
            goss: 'goss-linux-amd64'

          # Chrome - ARM (Chrome is not available for ARM)
          #- runner: "ubuntu-24.04-arm"
          #  tag: "chrome-arm"
          #  platform: "linux/arm64"
          #  browser: "chrome"
          #  goss: 'goss-linux-arm'

          # NOWEB - x86
          - runner: 'ubuntu-latest'
            tag: 'noweb'
            platform: 'amd64'
            browser: 'none'
            engine: 'NOWEB'
            goss: 'goss-linux-amd64'

          # NOWEB - ARM
          - runner: 'ubuntu-24.04-arm'
            tag: 'noweb-arm'
            platform: 'linux/arm64'
            browser: 'none'
            engine: 'NOWEB'
            goss: 'goss-linux-arm'

          # GOWS - x86
          - runner: 'ubuntu-latest'
            tag: 'gows'
            platform: 'amd64'
            browser: 'none'
            engine: 'GOWS'
            goss: 'goss-linux-amd64'

          # GOWS - ARM
          - runner: 'ubuntu-24.04-arm'
            tag: 'gows-arm'
            platform: 'linux/arm64'
            browser: 'none'
            engine: 'GOWS'
            goss: 'goss-linux-arm'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crazyscreamx/waha-custom
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-{{tag}}

      - name: Login to GHCR
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (attempt 1)
        id: build1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            USE_BROWSER=${{ matrix.browser }}
            WHATSAPP_DEFAULT_ENGINE=${{ matrix.engine }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait to retry build
        if: steps.build1.outcome == 'failure'
        run: |
          sleep 10

      - name: Build (attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            USE_BROWSER=${{ matrix.browser }}
            WHATSAPP_DEFAULT_ENGINE=${{ matrix.engine }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Wait to retry build
        if: steps.build2.outcome == 'failure'
        run: |
          sleep 10

      - name: Build (attempt 3)
        if: steps.build2.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            USE_BROWSER=${{ matrix.browser }}
            WHATSAPP_DEFAULT_ENGINE=${{ matrix.engine }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install goss
        env:
          GOSS_VERSION: 'v0.4.8'
        run: |
          curl -L https://github.com/goss-org/goss/releases/download/${{ env.GOSS_VERSION }}/${{ matrix.goss }} -o /usr/local/bin/goss
          chmod +rx /usr/local/bin/goss

      - name: Run smoke tests
        working-directory: tests/smoke
        timeout-minutes: 2
        run: |
          docker run -d \
            --name smoke \
            --rm -p3000:3000 \
            -e WAHA_API_KEY=test \
            ghcr.io/crazyscreamx/waha-custom:${{ matrix.tag }}

          sleep 3
          docker logs smoke
          goss validate --retry-timeout 30s --sleep 1s
          docker rm --force smoke

      - name: Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            USE_BROWSER=${{ matrix.browser }}
            WHATSAPP_DEFAULT_ENGINE=${{ matrix.engine }}
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
